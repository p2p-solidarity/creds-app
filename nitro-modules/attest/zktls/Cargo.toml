[package]
name = "creds-zktls"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
publish = false

# On-device TLSNotary prover (docs/ref/10 §3.1): a C ABI staticlib for the
# attest Nitro module, plus the `prove` CLI the notary E2E drives.
# tlsn is pinned with the notary (apps/notary/container) — move them together.
[lib]
name = "creds_zktls"
crate-type = ["staticlib", "rlib"]

[dependencies]
tlsn = { git = "https://github.com/tlsnotary/tlsn", tag = "v0.1.0-alpha.15", features = ["mozilla-certs"] }
async-tungstenite = { version = "0.29", features = ["tokio-runtime", "tokio-rustls-webpki-roots"] }
ws_stream_tungstenite = { version = "0.15", features = ["tokio_io"] }
tokio = { version = "1.38", features = ["rt", "rt-multi-thread", "macros", "net", "time"] }
tokio-util = { version = "0.7", features = ["compat"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
http-body-util = "0.1"
hyper = { version = "1.1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
