[package]
name = "creds-notary"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
publish = false

# tlsn is pinned to one release; it moves with the quarterly app update (docs/ref/10 §3.7).
[dependencies]
tlsn = { git = "https://github.com/tlsnotary/tlsn", tag = "v0.1.0-alpha.15", features = ["mozilla-certs"] }
anyhow = "1.0"
async-tungstenite = { version = "0.29", features = ["tokio-runtime", "tokio-rustls-webpki-roots"] }
ws_stream_tungstenite = { version = "0.15", features = ["tokio_io"] }
tokio = { version = "1.38", features = ["rt", "rt-multi-thread", "macros", "net", "io-util", "time", "sync"] }
tokio-util = { version = "0.7", features = ["compat"] }
serde_json = "1.0"

[profile.release]
strip = true
